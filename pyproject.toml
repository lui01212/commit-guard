[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commit-guard"
version = "0.1.0"
description = "Fast, zero-dependency Git commit message and staged file linter."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "lui01212", email = "luynbv@glotechvn.com" }
]
keywords = [
    "git",
    "commit",
    "conventional-commits",
    "linter",
    "pre-commit",
    "security",
    "developer-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
commit-guard = "commit_guard.cli:main"

[project.urls]
Homepage = "https://github.com/lui01212/commit-guard"
Repository = "https://github.com/lui01212/commit-guard.git"
Issues = "https://github.com/lui01212/commit-guard/issues"

[tool.hatch.build.targets.wheel]
packages = ["commit_guard"]
