[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commit-shield"
dynamic = ["version"]
description = "Fast, zero-dependency Git commit message and staged file linter."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "lui01212", email = "luynbv@glotechvn.com" }
]
keywords = [
    "git",
    "commit",
    "conventional-commits",
    "linter",
    "pre-commit",
    "security",
    "developer-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
commit-shield = "commit_guard.cli:main"
commit-guard = "commit_guard.cli:main"

[project.urls]
Homepage = "https://github.com/lui01212/commit-guard"
Repository = "https://github.com/lui01212/commit-guard.git"
Issues = "https://github.com/lui01212/commit-guard/issues"

[tool.hatch.version]
path = "commit_guard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["commit_guard"]

[project.optional-dependencies]
# Development tooling only. The runtime dependency list above stays empty on
# purpose: installing commit-guard must never pull anything in.
dev = [
    "ruff==0.6.9",
    "mypy==1.11.2",
    "build",
]

[tool.ruff]
target-version = "py38"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    # The codebase targets 3.8, so str.format() is used instead of f-strings
    # throughout; UP032/UP030 would rewrite those, and the explicit "{0}"
    # indices are a deliberate style choice here. Not a correctness issue.
    "UP032",
    "UP030",
]

[tool.mypy]
python_version = "3.8"
files = ["commit_guard"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
