name: "💡 Feature Request"
description: Suggest an idea or feature enhancement for commit-guard.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome feature requests and ideas from the community!
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: Is your feature request related to a problem or limitation?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
