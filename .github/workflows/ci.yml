name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          # setup-python has no 3.8 build for Ubuntu 26.04, so the oldest
          # supported interpreter stays on 24.04 when ubuntu-latest moves on.
          - os: ubuntu-24.04
            python-version: "3.8"
          # commit-guard writes git hooks and manipulates paths, so Windows is
          # exercised at both ends of the supported range.
          - os: windows-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.15"
          - os: macos-latest
            python-version: "3.15"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Configure git identity
      # The hook tests initialise throwaway repositories.
      run: |
        git config --global user.email "ci@example.com"
        git config --global user.name "CI"
        git config --global init.defaultBranch main

    - name: Run unit tests (built-in unittest)
      run: python -m unittest discover tests -v

    - name: Test CLI execution
      run: |
        pip install .
        commit-guard --version
        commit-guard check-msg -m "feat(ci): test github actions workflow"

  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    # Separate job on purpose: ruff and mypy are development tools only. They
    # are installed here and never become runtime dependencies of the package.
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install lint tooling
      run: pip install "ruff==0.17.0" "mypy==1.16.1"

    - name: Ruff (lint)
      run: ruff check commit_guard tests

    - name: Ruff (format check)
      run: ruff format --check commit_guard tests

    - name: Mypy
      run: mypy commit_guard

  package:
    name: Verify package builds
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Build sdist and wheel
      run: |
        pip install build
        python -m build

    - name: Check that the dynamic version resolves
      # Guards against __version__ and the packaging metadata drifting apart.
      run: |
        pip install dist/*.whl
        test "$(commit-guard --version)" = "commit-guard $(python -c 'import commit_guard; print(commit_guard.__version__)')"
