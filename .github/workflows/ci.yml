name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Tests (${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # setup-python no longer ships 3.8 for ubuntu-latest (24.04), so the
          # oldest supported interpreter is pinned to 22.04.
          - os: ubuntu-22.04
            python-version: "3.8"
          # commit-guard writes git hooks and manipulates paths, so Windows is
          # exercised at both ends of the supported range.
          - os: windows-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Configure git identity
      # The hook tests initialise throwaway repositories.
      run: |
        git config --global user.email "ci@example.com"
        git config --global user.name "CI"
        git config --global init.defaultBranch main

    - name: Run unit tests (built-in unittest)
      run: python -m unittest discover tests -v

    - name: Test CLI execution
      run: |
        pip install .
        commit-guard --version
        commit-guard check-msg -m "feat(ci): test github actions workflow"

  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    # Separate job on purpose: ruff and mypy are development tools only. They
    # are installed here and never become runtime dependencies of the package.
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install lint tooling
      run: pip install "ruff==0.6.9" "mypy==1.11.2"

    - name: Ruff (lint)
      run: ruff check commit_guard tests

    - name: Ruff (format check)
      run: ruff format --check commit_guard tests

    - name: Mypy
      run: mypy commit_guard

  package:
    name: Verify package builds
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build sdist and wheel
      run: |
        pip install build
        python -m build

    - name: Check that the dynamic version resolves
      # Guards against __version__ and the packaging metadata drifting apart.
      run: |
        pip install dist/*.whl
        test "$(commit-guard --version)" = "commit-guard $(python -c 'import commit_guard; print(commit_guard.__version__)')"
